<div class="login-page">
  <div class="login-card">
    <!-- Regular Login Form -->
    <div *ngIf="!showFirmSelection">
      <div class="login-logo">🧾</div>
      <h1 class="login-brand">MyBill</h1>
      <p class="login-subtitle">Sign in to continue</p>

      <form (ngSubmit)="onSubmit()" class="login-form">
        <div class="field-group">
          <label for="username">Username</label>
          <input
            id="username"
            type="text"
            [(ngModel)]="username"
            name="username"
            placeholder="Enter your username"
            autocomplete="username"
            required>
        </div>

        <div class="field-group">
          <label for="password">Password</label>
          <input
            id="password"
            type="password"
            [(ngModel)]="password"
            name="password"
            placeholder="Enter your password"
            autocomplete="current-password"
            required>
        </div>

        <div class="error-msg" *ngIf="error">{{ error }}</div>

        <button type="submit" class="login-btn" [disabled]="loading">
          {{ loading ? 'Signing in...' : 'Sign In' }}
        </button>
      </form>
    </div>

    <!-- Firm Selection Screen -->
    <div *ngIf="showFirmSelection" class="firm-selection-container">
      <div class="firm-selection-header">
        <h2>Select Your Firm</h2>
        <p>You have access to multiple firms. Please select one to continue.</p>
      </div>

      <div class="firms-list">
        <div
          *ngFor="let firm of availableFirms"
          class="firm-card"
          (click)="onSelectFirm(firm.firmCode)"
          [class.primary]="firm.isPrimary">
          <div class="firm-info">
            <h3>{{ firm.firmName }}</h3>
            <p class="firm-code">Code: {{ firm.firmCode }}</p>
            <span class="access-level" [class]="firm.accessLevel.toLowerCase()">
              {{ firm.accessLevel }}
            </span>
            <span *ngIf="firm.isPrimary" class="primary-badge">Primary Firm</span>
          </div>
          <div class="select-arrow">→</div>
        </div>
      </div>

      <button
        type="button"
        class="back-btn"
        (click)="onBackFromFirmSelection()">
        Back to Login
      </button>

      <div class="error-msg" *ngIf="error">{{ error }}</div>
    </div>
  </div>
</div>
