server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 20M;

    location /api/business-intelligence/ {
        proxy_pass https://mybill-service-276371417285.us-central1.run.app/api/business-intelligence/;
        proxy_set_header Host mybill-service-276371417285.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_send_timeout 300s;
    }

    location /api/ {
        proxy_pass https://mybill-service-276371417285.us-central1.run.app/api/;
        proxy_set_header Host mybill-service-276371417285.us-central1.run.app;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_read_timeout 60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
